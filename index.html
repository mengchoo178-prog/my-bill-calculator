<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta charset="UTF-8">
<title>My Bill Calculator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif;
    background: #f2f2f7;
    color: #111;
  }
  .app {
    max-width: 520px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 28px 18px 35px;
  }
  h1 { font-size: 32px; margin: 8px 0 24px; }
  .card {
    background: white;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 14px;
  }
  label {
    display: block;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 7px;
  }
  input {
    width: 100%;
    height: 54px;
    border: 1px solid #d1d1d6;
    border-radius: 12px;
    padding: 0 15px;
    font-size: 22px;
    outline: none;
    background: #fafafa;
  }
  input:focus { border-color: #555; background: white; }
  .row { margin-bottom: 15px; }
  .row:last-child { margin-bottom: 0; }
  .line {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    font-size: 17px;
  }
  .total {
    margin-top: 10px;
    padding-top: 15px;
    border-top: 1px solid #ddd;
    font-size: 25px;
    font-weight: 700;
  }
  button {
    width: 100%;
    height: 56px;
    border: 0;
    border-radius: 15px;
    background: #111;
    color: white;
    font-size: 19px;
    font-weight: 700;
    margin-top: 4px;
  }
  button:active { opacity: .75; }
  .note { color: #666; font-size: 13px; line-height: 1.4; margin-top: 12px; }
</style>
</head>
<body>
<div class="app">
  <h1>My Bill Calculator</h1>

  <div class="card">
    <div class="row">
      <label for="cost1">Cost 1</label>
      <input id="cost1" type="number" inputmode="decimal" step="0.01" placeholder="0.00">
    </div>
    <div class="row">
      <label for="cost2">Cost 2</label>
      <input id="cost2" type="number" inputmode="decimal" step="0.01" placeholder="Optional">
    </div>
    <div class="row">
      <label for="cost3">Cost 3</label>
      <input id="cost3" type="number" inputmode="decimal" step="0.01" placeholder="Optional">
    </div>
    <button onclick="calculate()">Calculate</button>
  </div>

  <div class="card">
    <div class="line"><span>Subtotal</span><strong id="subtotal">$0.00</strong></div>
    <div class="line"><span>Service Charge (10%)</span><strong id="service">$0.00</strong></div>
    <div class="line"><span>GST (9%)</span><strong id="gst">$0.00</strong></div>
    <div class="line total"><span>TOTAL</span><strong id="total">$0.00</strong></div>
    <div class="note">GST is calculated on the subtotal plus the 10% service charge.</div>
  </div>
</div>

<script>
function money(n) {
  return "$" + n.toFixed(2);
}

function calculate() {
  const c1 = parseFloat(document.getElementById("cost1").value) || 0;
  const c2 = parseFloat(document.getElementById("cost2").value) || 0;
  const c3 = parseFloat(document.getElementById("cost3").value) || 0;

  const subtotal = c1 + c2 + c3;
  const service = subtotal * 0.10;
  const gst = (subtotal + service) * 0.09;
  const total = subtotal + service + gst;

  document.getElementById("subtotal").textContent = money(subtotal);
  document.getElementById("service").textContent = money(service);
  document.getElementById("gst").textContent = money(gst);
  document.getElementById("total").textContent = money(total);
}

document.querySelectorAll("input").forEach(input => {
  input.addEventListener("input", calculate);
});
</script>
</body>
</html>
